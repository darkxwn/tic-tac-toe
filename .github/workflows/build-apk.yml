name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install client dependencies & Build Web App
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Sync with Capacitor Android
        working-directory: ./client
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for clarity
        run: |
          mkdir -p release-artifacts
          cp client/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/tic-tac-toe-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: release-artifacts/tic-tac-toe-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/tic-tac-toe-latest.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
