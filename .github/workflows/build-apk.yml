name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install client dependencies & Build Web App
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Sync with Capacitor Android
        working-directory: ./client
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APKs (Universal, arm64-v8a, armeabi-v7a)
        working-directory: ./client/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-apks
          cp client/android/app/build/outputs/apk/debug/app-universal-debug.apk release-apks/tic-tac-toe-universal.apk
          cp client/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk release-apks/tic-tac-toe-arm64-v8a.apk
          cp client/android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk release-apks/tic-tac-toe-armeabi-v7a.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Build" >> $GITHUB_OUTPUT
          fi

      - name: Publish 3 APKs to GitHub Releases (No Description)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          body: ""
          generate_release_notes: false
          files: |
            release-apks/tic-tac-toe-universal.apk
            release-apks/tic-tac-toe-arm64-v8a.apk
            release-apks/tic-tac-toe-armeabi-v7a.apk
          prerelease: false
          draft: false
          make_latest: true
