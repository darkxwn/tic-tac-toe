name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install client dependencies & Build Web App
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Sync with Capacitor Android
        working-directory: ./client
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          cp client/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/tic-tac-toe-latest.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Tic-Tac-Toe Latest APK" >> $GITHUB_OUTPUT
          fi

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          body: |
            ### 📱 Скачать игру для Android
            
            Прямой файл `.apk` без zip-архива (готов к установке):
            👉 **[Скачать tic-tac-toe-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/tic-tac-toe-latest.apk)**
          files: release-artifacts/tic-tac-toe-latest.apk
          prerelease: false
          draft: false
          make_latest: true

      - name: Add Direct Link to Job Summary
        run: |
          echo "## 📱 Прямое скачивание APK (без zip)" >> $GITHUB_STEP_SUMMARY
          echo "Прямая ссылка на файл: [tic-tac-toe-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/tic-tac-toe-latest.apk)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-apk
          path: release-artifacts/tic-tac-toe-latest.apk
          if-no-files-found: error
          retention-days: 30
