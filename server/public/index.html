    <!-- Мгновенная установка темы ДО отрисовки страницы (предотвращает мерцание/FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('infinity_ttt_theme');
          var theme = (saved === 'neon' || saved === 'dark' || saved === 'light') ? saved : 'dark';
          document.documentElement.classList.add('theme-' + theme);
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
